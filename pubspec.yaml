name: civicconnect
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_ai: ^3.11.0

  http: ^1.6.0
  flutter_map: ^8.3.0
  image_picker: ^1.0.7
  latlong2: ^0.9.1
  lottie: ^3.1.0
  provider: ^6.1.5+1
  geolocator: ^14.0.2
  url_launcher: ^6.3.1
  uuid: ^4.5.2
  vibration: ^3.1.4


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  
  assets:
    - assets/logo.png
    - assets/Icon-512.png
    - assets/icon.png
    - assets/images/
    - assets/icons/
    - assets/animations/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FFF5EDE0"   # crème color
  adaptive_icon_foreground: "assets/icon.png"
